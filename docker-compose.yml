services:
  db:
    image: pgvector/pgvector:pg16
    container_name: litnexus-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litnexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litnexus_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-litnexus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litnexus} -d ${POSTGRES_DB:-litnexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
